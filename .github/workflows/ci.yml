name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            constraints.txt

      - name: Instala dependências de desenvolvimento
        run: pip install -r requirements-dev.txt -c constraints.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Formatação (ruff format --check)
        run: ruff format --check .

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            constraints.txt

      - name: Instala dependências de desenvolvimento
        run: pip install -r requirements-dev.txt -c constraints.txt

      - name: Testes unitários
        run: pytest -q

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            constraints.txt

      - name: Instala dependências de desenvolvimento
        run: pip install -r requirements-dev.txt -c constraints.txt

      # Separado do pytest para o log mostrar quanto tempo vai para o pull das imagens.
      - name: Pull das imagens dos containers de teste
        run: |
          docker pull postgres:16-alpine
          docker pull redis:7-alpine

      - name: Testes de integração
        run: pytest -m integration -v

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: asynctask
          POSTGRES_PASSWORD: asynctask
          POSTGRES_DB: asynctask_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asynctask -d asynctask_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://asynctask:asynctask@localhost:5432/asynctask_db
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: memory://
      CELERY_RESULT_BACKEND: cache+memory://
      RATE_LIMIT_STORAGE_URI: memory://
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      - name: Instala dependências de produção
        run: pip install -r requirements.txt -c constraints.txt

      - name: Sobe o schema pela migration
        run: alembic upgrade head

      - name: Models e migrations não podem divergir
        run: alembic check

      - name: Downgrade completo e upgrade de novo
        run: |
          alembic downgrade base
          alembic upgrade head
